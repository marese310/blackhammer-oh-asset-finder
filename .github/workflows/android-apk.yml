name: Android APK

on:
  workflow_dispatch:
    inputs:
      accept_android_sdk_licenses:
        description: "I reviewed Google's Android SDK License Agreement and authorize this workflow to accept it."
        required: true
        type: boolean
        default: false
      publish_release:
        description: "Publish the built debug APK as a permanent GitHub Release."
        required: true
        type: boolean
        default: false
      release_tag:
        description: "Git tag without spaces, e.g. android-v1.0.0."
        required: true
        type: string
        default: android-v1.0.0

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.accept_android_sdk_licenses }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android 35 build tools
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests and assemble APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
        working-directory: android

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: blachammer-once-human-asset-finder-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: ${{ inputs.accept_android_sdk_licenses && inputs.publish_release }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Normalize and validate release tag
        id: release-tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag="$(printf '%s' "$RELEASE_TAG" | tr '[:space:]' '-' | sed -E 's/-+/-/g; s/^-//; s/-$//')"
          if ! git check-ref-format "refs/tags/$tag"; then
            echo "::error::Invalid Git tag '$RELEASE_TAG'. Use letters, numbers, dots, underscores, and hyphens."
            exit 1
          fi
          if [ "$tag" != "$RELEASE_TAG" ]; then
            echo "::notice::Using normalized release tag '$tag'."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download the built APK
        uses: actions/download-artifact@v8
        with:
          name: blachammer-once-human-asset-finder-android
          path: release

      - name: Publish APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" release/app-debug.apk \
            --target "$GITHUB_SHA" \
            --title "BlacHammer Once Human Asset Finder $RELEASE_TAG" \
            --notes "Android APK for the BlacHammer Once Human Asset Finder. Download app-debug.apk and install it on your Android device. The first launch imports the offline asset database and can take a short time."

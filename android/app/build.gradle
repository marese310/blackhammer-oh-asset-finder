plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blachammer.assetfinder'
    compileSdk 35

    defaultConfig {
        applicationId 'com.blachammer.assetfinder'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(Test).configureEach {
    systemProperty 'asset.database.path',
            file('src/main/assets/OnceHuman_EnhancedDatabase.csv').absolutePath
}
